# Builds the static site and publishes it on GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild every day, so the version, sizes and checksums follow new releases.
  schedule:
    - cron: "23 9 * * *"
  # The game's release workflow can ask for a rebuild right away
  # (POST /repos/<owner>/snooklegend.app/dispatches, event_type "game-released").
  repository_dispatch:
    types: [game-released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Reads the latest release of the game (and its checksums) while building.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
